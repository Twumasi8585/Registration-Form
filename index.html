<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Systems</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="Register Icon.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="main">
            <h2>Online Registration System</h2>
           
           <div class="content">
             
<form id="registerForm">
    <div class="form">
        <input type="text" id="name" required>
        <label>Name</label>
    </div>

    <div class="form">
        <input type="email" id="email" required>
        <label>Email</label>
    </div>

    <div class="form">
        <input type="password" id="password" required>
        <label>Password</label>

        <i class="fa-solid fa-eye" id="showPassword"></i>
        <i class="fa-solid fa-eye-slash hide" id="hidePassword"></i>
    </div>

    <div class="content1">
        <p><a href="">Forgot Password?</a> Click Here</p>
    </div>

    <div class="Sub-Button">
        <button type="submit">Submit</button>
    </div>
</form>
           
            </div>
        
        </div>
    </div>


    

    <script src="script.js"></script>
    
</body>
</html>
